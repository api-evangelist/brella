schemes:
- name: api_key
  type: apiKey
  in: header
  headerName: Brella-Api-Access-Token
  description: >-
    Organization-level API key sent in the Brella-Api-Access-Token request
    header. Keys are generated by an organization admin from the Brella admin
    panel (Organization / API key) and shown only once at creation time. All
    requests must use SSL/TLS and additionally send Content-Type: application/json
    and Accept: application/vnd.brella.v4+json (the Accept header selects the API
    version, v4). Access is gated - the API key feature is activated on the
    account once the integration is enabled by Brella.
  sources:
  - https://developer.brella.io/authentication-and-api-keys
  - https://help-organizers.brella.io/en/articles/181542-set-up-api-and-event-ids
