name: Brella
kind: company
description: Brella is an event networking and engagement platform for conferences,
  trade shows, livestreams, and hybrid events, best known for AI-powered attendee
  matchmaking and one-to-one meeting booking. Organizers manage events, attendees,
  speakers, sponsors, schedules, and networking through the Brella web and mobile
  apps. Brella exposes a documented public REST Integration API and outbound
  webhooks so organizers can read event data (events, attendees, speakers, sponsors,
  timeslots, invites) and sync it to registration, CRM, and analytics tools. API
  access is gated - an organization admin generates an API key from the Brella admin
  panel after the integration feature is enabled for the account.
