description: >-
  FinOps view of Brella spend. Brella is a contact-sales SaaS event platform
  billed via negotiated event / platform licensing rather than public
  usage-based API metering. The Integration API and webhooks are included with
  a paid engagement and are not separately metered or invoiced per call, so
  there are no public per-token or per-request meters to track. Cost management
  is contract-oriented: license scope, number of events, and add-ons.
notes: >-
  Not reconciled - Brella publishes no public pricing or billing exports. The
  billing model below reflects the observed contact-sales SaaS structure;
  confirm invoice granularity and any usage components with Brella on
  reconciliation.
sources:
- https://www.brella.io/
- https://www.brella.io/what-you-get
- https://developer.brella.io/
