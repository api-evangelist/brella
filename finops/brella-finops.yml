serviceCategory: Events and Engagement
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
  - Purchase
focusColumns:
  ServiceName: Brella Event Platform
  ServiceCategory: Events and Engagement
  ProviderName: Brella
  PublisherName: Brella
  InvoiceIssuerName: Brella
  BillingCurrency: USD
  ChargeCategory: Purchase
