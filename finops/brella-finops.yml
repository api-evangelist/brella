meters:
- name: platform_license
  description: >-
    Negotiated event / platform license fee. Not usage-metered; the Integration
    API and webhooks are included with the engagement.
  unit: contract
  aggregation: flat
  dimensions:
  - organization
principles:
- name: Visibility
  description: >-
    Track Brella spend at the contract / event level; the API itself is not
    separately metered, so map cost to events rather than API calls.
- name: Allocation
  description: Allocate the platform license to the owning event or business unit.
- name: Optimization
  description: >-
    Right-size the license to the number and scale of events; negotiate add-ons
    and multi-event terms with Brella sales.
- name: Accountability
  description: Assign an owner per event/contract to review renewal scope and cost.
